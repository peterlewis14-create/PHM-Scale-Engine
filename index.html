<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hydraulic Model Scale Engine</title>

<!-- ✅ Correct CSS link -->
<link rel="stylesheet" href="styles.css">

<!-- ✅ Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <div class="header">
    <h1>Hydraulic Model Scale Engine</h1>
    <span>Step <span id="step">1</span>/4</span>
  </div>
</header>

<div class="container">

<!-- STEP 1 -->
<div id="s1" class="card">
<h2>Project Context</h2>

<label>Risk Level</label>
<select id="risk">
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

<label>Objectives</label>
<div id="objectives"></div>

<button onclick="go(1)">Next →</button>
</div>

<!-- STEP 2 -->
<div id="s2" class="card hidden">
<h2>Prototype</h2>

<input id="Lp" placeholder="Length (m)">
<input id="Wp" placeholder="Width (m)">
<input id="Qp" placeholder="Flow (m³/s)">
<input id="Hmax" placeholder="Headwater (m)">
<input id="Elev" placeholder="Elevation (m)">

<button onclick="back(2)">← Back</button>
<button onclick="go(2)">Next →</button>
</div>

<!-- STEP 3 -->
<div id="s3" class="card hidden">
<h2>Laboratory</h2>

<input id="Lb" placeholder="Bay length (m)">
<input id="Wb" placeholder="Bay width (m)">
<input id="Hb" placeholder="Bay height (m)">
<input id="Qb" placeholder="Flow (L/s)">

<button onclick="back(3)">← Back</button>
<button onclick="run()">Calculate</button>
</div>

<!-- RESULTS -->
<div id="s4" class="card hidden">

<div class="hero">
<div id="scale"></div>
<div id="summary"></div>
</div>

<canvas id="chart"></canvas>

<div id="alternatives"></div>
<div id="table"></div>
<div id="warnings"></div>

<button onclick="exportReport()">Export Report</button>

</div>

</div>

<!-- ✅ Correct JS link -->
<script src="engine.js"></script>

</body>
</html>
