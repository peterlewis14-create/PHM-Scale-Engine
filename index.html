<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hydraulic Model Scale Tool</title>

<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
<h1>Hydraulic Model Scale Tool</h1>
<span>Step <span id="step">1</span>/4</span>
</header>

<div class="container">

<!-- STEP 1 -->
<div id="s1" class="card">
<h2>Project Context</h2>

<label>Design Stage</label>
<select id="stage">
<option>Concept</option>
<option>Preliminary</option>
<option>Detailed</option>
</select>

<label>Objectives</label>
<div id="objectives"></div>

<label>Risk</label>
<select id="risk">
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

<button onclick="go(1)">Next</button>
</div>

<!-- STEP 2 -->
<div id="s2" class="card hidden">
<h2>Prototype</h2>

<input id="Lp" placeholder="Length (m)">
<input id="Wp" placeholder="Width (m)">
<input id="Qp" placeholder="Discharge (m³/s)">
<input id="Hmax" placeholder="Headwater (m)">
<input id="Elev" placeholder="Min elevation (m)">

<button onclick="back(2)">Back</button>
<button onclick="go(2)">Next</button>
</div>

<!-- STEP 3 -->
<div id="s3" class="card hidden">
<h2>Laboratory</h2>

<input id="Lb" placeholder="Bay length (m)">
<input id="Wb" placeholder="Bay width (m)">
<input id="Hb" placeholder="Bay height (m)">
<input id="Qb" placeholder="Flow (L/s)">

<button onclick="back(3)">Back</button>
<button onclick="run()">Run</button>
</div>

<!-- STEP 4 -->
<div id="s4" class="card hidden">

<div class="hero">
<div id="scale"></div>
<div id="summary"></div>
</div>

<canvas id="chart"></canvas>

<!-- ✅ SLIDER -->
<div class="card">
<h3>Scale Explorer</h3>
<input type="range" id="scaleSlider" min="5" max="100" step="5">
<div id="sliderOutput"></div>
</div>

<!-- ✅ SENSITIVITY -->
<div class="card">
<h3>Sensitivity Analysis</h3>
<input type="range" id="flowSlider" min="50" max="5000" step="50">
<div id="sensOutput"></div>
</div>

<!-- ✅ LAYOUT -->
<div class="card">
<h3>Model Layout</h3>
<canvas id="layout" width="400" height="200"></canvas>
</div>

<div id="alternatives"></div>
<div id="table"></div>

<div class="warnings-card">
<h3>Engineering Warnings</h3>
<div id="warnings"></div>
</div>

<button onclick="exportReport()">Export PDF Report</button>

</div>

</div>

<script src="engine.js"></script>
</body>
</html>
