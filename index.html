<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydraulic Model Scale Tool</title>

<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Hydraulic Model Scale Tool</h1>
    <div class="steps">Step <span id="stepNo">1</span>/4</div>
  </div>
</header>

<div class="container">

<!-- STEP 1 -->
<div id="step1" class="card">
<h2>Project Context</h2>

<label>Design Stage ⓘ</label>
<select id="stage"></select>

<label>Risk</label>
<select id="risk"></select>

<label>Objectives</label>
<div id="objectives"></div>

<div class="nav">
  <div></div>
  <button onclick="next(1)" class="primary">Next</button>
</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="card hidden">
<h2>Prototype</h2>

<input id="Lp" placeholder="Length (m)">
<input id="Wp" placeholder="Width (m)">
<input id="Qp" placeholder="Flow (m³/s)">
<input id="Hmax" placeholder="Headwater">
<input id="Elev" placeholder="Min elevation">

<div class="nav">
<button onclick="back(2)">Back</button>
<button onclick="next(2)" class="primary">Next</button>
</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="card hidden">
<h2>Laboratory</h2>

<input id="Lb" placeholder="Bay length">
<input id="Wb" placeholder="Bay width">
<input id="Hb" placeholder="Bay height">
<input id="Qb" placeholder="Available flow (L/s)">

<div class="nav">
<button onclick="back(3)">Back</button>
<button onclick="run()" class="primary">Calculate</button>
</div>
</div>

<!-- STEP 4 -->
<div id="step4" class="card hidden">

<div class="hero">
<div class="scale" id="scaleOut"></div>
<div class="subtitle">Recommended engineering scale</div>
</div>

<div id="summary"></div>

<canvas id="chart"></canvas>

<div id="alternatives"></div>

<div id="table"></div>

<div id="warnings"></div>

<button onclick="exportReport()" class="primary">Export Report</button>

</div>

</div>

<script src="engine.js"></script>
</body>
</html>
